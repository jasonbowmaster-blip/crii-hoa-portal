<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Documents</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F5D50}a:hover{color:#1F4238}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F6F7F4; font-family: Inter, system-ui, sans-serif; color: #1B1F1D; box-sizing: border-box">
<div style="padding: 56px 20px 112px; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box; height: 844px; overflow-y: auto">
<h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 28px; font-weight: 600">Documents</h1>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Search documents
<input type="search" placeholder="Try fence rules or 2027 budget" style="height: 48px; border-radius: 12px; border: 1px solid #C9CEC9; background: #FFFFFF; padding: 0 14px; font-size: 16px; font-family: inherit; color: #1B1F1D; box-sizing: border-box"></label>

<h2 style="margin: 6px 0 0; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; color: #555C58">NEW</h2>
<sc-for list="{{ recent }}" as="doc" hint-placeholder-count="2">
<a href="Documents.dc.html" style="display: flex; gap: 12px; align-items: center; background: #FFFFFF; border: 1px solid #E3E6E1; border-radius: 14px; padding: 14px 16px; text-decoration: none; color: #1B1F1D">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2F5D50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/></svg>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{ doc.name }}</span><span style="font-size: 13px; color: #555C58">{{ doc.meta }}</span></span>
</a>
</sc-for>

<h2 style="margin: 6px 0 0; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; color: #555C58">FOLDERS</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{ folders }}" as="f" hint-placeholder-count="6">
<a href="Documents.dc.html" style="display: flex; flex-direction: column; gap: 8px; background: #FFFFFF; border: 1px solid #E3E6E1; border-radius: 14px; padding: 14px; text-decoration: none; color: #1B1F1D; min-height: 96px; box-sizing: border-box">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2F5D50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
<span style="font-size: 15px; font-weight: 600">{{ f.name }}</span>
</a>
</sc-for>
</div>
</div>

<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FFFFFF; border-top: 1px solid #E3E6E1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 8px 24px; box-sizing: border-box">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #555C58; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Home</a>
<a href="Bill.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #555C58; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg>My bill</a>
<a href="Documents.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #2F5D50; font-size: 12px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/></svg>Documents</a>
<a href="Message.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #555C58; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>Message</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      recent: [
        { name: '2027 budget summary', meta: 'Budgets · posted Dec 15' },
        { name: 'Board meeting minutes, draft', meta: 'Minutes · November meeting' }
      ],
      folders: [
        { name: 'Governing documents' },
        { name: 'Rules and ARB guidelines' },
        { name: 'Meeting minutes' },
        { name: 'Board packets' },
        { name: 'Budgets and financials' },
        { name: 'Forms' }
      ]
    };
  }
}
</script>
</body>
</html>
