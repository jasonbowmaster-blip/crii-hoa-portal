<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F5D50}a:hover{color:#1F4238}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F6F7F4; font-family: Inter, system-ui, sans-serif; color: #1B1F1D; box-sizing: border-box">
<div style="padding: 56px 20px 112px; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box; height: 844px; overflow-y: auto">
<span style="align-self: flex-start; font-size: 12px; font-weight: 600; color: #7A5A00; background: #F9EEDA; border-radius: 999px; padding: 4px 10px">Later: March to May</span>
<h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 28px; font-weight: 600">Calendar</h1>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #555C58">Board meetings are every other month and open to all owners. Agendas post here when the board gets them.</p>

<sc-for list="{{ events }}" as="ev" hint-placeholder-count="5">
<article style="display: flex; gap: 14px; align-items: flex-start; background: #FFFFFF; border: 1px solid #E3E6E1; border-radius: 16px; padding: 14px 16px">
<div style="width: 52px; height: 56px; border-radius: 12px; background: {{ ev.tint }}; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0">
<span style="font-size: 12px; font-weight: 600; color: #2F5D50">{{ ev.mon }}</span>
<span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 20px; font-weight: 600; color: #1B1F1D">{{ ev.day }}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
<span style="font-size: 16px; font-weight: 600">{{ ev.title }}</span>
<span style="font-size: 14px; color: #555C58">{{ ev.when }}</span>
<span style="font-size: 13px; color: #555C58">{{ ev.note }}</span>
</div>
</article>
</sc-for>

<a href="Main.dc.html" style="display: flex; justify-content: center; align-items: center; height: 50px; border-radius: 12px; border: 1px solid #C9CEC9; background: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none">Add HOA events to my phone calendar</a>
</div>

<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FFFFFF; border-top: 1px solid #E3E6E1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 8px 24px; box-sizing: border-box">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #555C58; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Home</a>
<a href="Bill.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #555C58; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg>My bill</a>
<a href="Documents.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #555C58; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/></svg>Documents</a>
<a href="Message.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #555C58; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>Message</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const green = '#E6EFEB', sand = '#F3EDE2';
    return {
      events: [
        { mon: 'JAN', day: '19', title: 'Board meeting', when: 'Tue 7:00 PM · [LOCATION or video link]', note: 'Agenda packet posted Jan 12', tint: green },
        { mon: 'FEB', day: '—', title: 'Tree work, common area', when: '[DATE] · 8 AM to 3 PM', note: 'Keep cars off [STREET]', tint: sand },
        { mon: 'MAR', day: '16', title: 'Board meeting', when: 'Tue 7:00 PM · [LOCATION or video link]', note: 'Open to all owners', tint: green },
        { mon: '[MO]', day: '—', title: 'Dues due', when: '[DUE DATE]', note: 'No late fee before this date', tint: sand },
        { mon: '[MO]', day: '—', title: 'Annual meeting', when: '[DATE] · [LOCATION]', note: 'Notice mailed 14 days ahead', tint: green }
      ]
    };
  }
}
</script>
</body>
</html>
